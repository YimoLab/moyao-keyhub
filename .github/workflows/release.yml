name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 校验更新签名密钥
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEY" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY 未配置"; exit 1; fi
          if [ -z "$PASS" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD 未配置"; exit 1; fi
          echo "签名密钥长度: ${#KEY}"
          echo "test" > "$RUNNER_TEMP/payload.txt"
          if ! npx tauri signer sign -k "$KEY" -p "$PASS" "$RUNNER_TEMP/payload.txt" 2> "$RUNNER_TEMP/sign.err"; then
            msg=$(tail -n 3 "$RUNNER_TEMP/sign.err" | awk '{printf "%s ", $0}' | cut -c1-300)
            echo "::error::签名密钥校验失败：$msg"
            exit 1
          fi
          echo "签名密钥校验通过"

      - name: 构建、签名并创建 Release
        id: release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名密钥：在仓库 Settings → Secrets and variables → Actions 中配置
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          includeUpdaterJson: false
          releaseName: '墨钥 KeyHub ${{ github.ref_name }}'
          releaseBody: 'Windows 安装包与自动更新文件（latest.json / .sig）已生成。'
          # 先创建草稿，核对产物后再手动发布；发布后 latest.json 才能被客户端读取
          releaseDraft: true
          prerelease: false

      - name: 生成并上传 latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.releaseId }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          export TAG
          if [ -z "${RELEASE_ID}" ]; then echo "::error::tauri-action 没有返回 releaseId"; exit 1; fi
          SIG_FILE=$(ls src-tauri/target/release/bundle/nsis/*.exe.sig | head -1)
          EXE_NAME=$(basename "$SIG_FILE" .sig)
          export SIG_FILE EXE_NAME
          URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq ".assets[] | select(.name == \"${EXE_NAME}\") | .browser_download_url")
          if [ -z "$URL" ]; then echo "::error::Release 中找不到安装包 ${EXE_NAME}"; exit 1; fi
          export URL
          node -e '
            const fs = require("fs");
            const content = {
              version: process.env.TAG.replace(/^v/, ""),
              notes: "墨钥 KeyHub " + process.env.TAG,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(process.env.SIG_FILE, "utf8").trim(),
                  url: process.env.URL
                }
              }
            };
            fs.writeFileSync("latest.json", JSON.stringify(content, null, 2));
          '
          OLD_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.assets[] | select(.name == "latest.json") | .id')
          if [ -n "$OLD_ID" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${OLD_ID}"
          fi
          gh api -X POST -H "Content-Type: application/octet-stream" --input latest.json             "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=latest.json"
          echo "latest.json 已上传"
