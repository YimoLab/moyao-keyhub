name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 校验更新签名密钥
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEY" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY 未配置"; exit 1; fi
          if [ -z "$PASS" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD 未配置"; exit 1; fi
          echo "签名密钥长度: ${#KEY}"
          echo "test" > "$RUNNER_TEMP/payload.txt"
          if ! npx tauri signer sign -k "$KEY" -p "$PASS" "$RUNNER_TEMP/payload.txt" 2> "$RUNNER_TEMP/sign.err"; then
            msg=$(tail -n 3 "$RUNNER_TEMP/sign.err" | awk '{printf "%s ", $0}' | cut -c1-300)
            echo "::error::签名密钥校验失败：$msg"
            exit 1
          fi
          echo "签名密钥校验通过"

      - name: 诊断构建
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! npm run tauri -- build --no-bundle > build.log 2>&1; then
            msg=$(tail -n 40 build.log | awk '{printf "%s | ", $0}' | cut -c1-1800)
            echo "::error::tauri build --no-bundle 失败：$msg"
            exit 1
          fi
          echo "诊断构建通过"

      - name: 构建、签名并创建 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名密钥：在仓库 Settings → Secrets and variables → Actions 中配置
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '墨钥 KeyHub ${{ github.ref_name }}'
          releaseBody: 'Windows 安装包与自动更新文件（latest.json / .sig）已生成。'
          # 先创建草稿，核对产物后再手动发布；发布后 latest.json 才能被客户端读取
          releaseDraft: true
          prerelease: false
