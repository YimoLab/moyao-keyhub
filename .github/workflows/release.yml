name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 校验更新签名密钥
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEY" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY 未配置"; exit 1; fi
          if [ -z "$PASS" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD 未配置"; exit 1; fi
          echo "签名密钥长度: ${#KEY}"
          echo "test" > "$RUNNER_TEMP/payload.txt"
          if ! npx tauri signer sign -k "$KEY" -p "$PASS" "$RUNNER_TEMP/payload.txt" 2> "$RUNNER_TEMP/sign.err"; then
            msg=$(tail -n 3 "$RUNNER_TEMP/sign.err" | awk '{printf "%s ", $0}' | cut -c1-300)
            echo "::error::签名密钥校验失败：$msg"
            exit 1
          fi
          echo "签名密钥校验通过"

      - name: 清理同 tag 的旧草稿
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            echo "发现同 tag 草稿，先删除：$TAG"
            gh release delete "$TAG" --yes --cleanup-tag=false
          else
            echo "没有需要清理的草稿"
          fi

      - name: 读取发行说明
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          FILE="release-notes/${TAG}.md"
          if [ -f "$FILE" ]; then
            echo "使用发行说明：$FILE"
            BODY="$(cat "$FILE")"
          else
            echo "未找到 $FILE，使用默认说明"
            BODY="Windows 安装包与自动更新文件（latest.json / .sig）已生成。"
          fi
          {
            echo 'body<<RELEASE_NOTES_EOF'
            printf '%s\n' "$BODY"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 构建、签名并创建 Release
        id: release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名密钥：在仓库 Settings → Secrets and variables → Actions 中配置
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          includeUpdaterJson: false
          releaseName: '墨钥 KeyHub ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          # 先创建草稿，核对产物后再手动发布；发布后 latest.json 才能被客户端读取
          releaseDraft: true
          prerelease: false

      - name: 生成并上传 latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.releaseId }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          export TAG
          if [ -z "${RELEASE_ID}" ]; then echo "::error::tauri-action 没有返回 releaseId"; exit 1; fi
          SIG_FILE=$(ls src-tauri/target/release/bundle/nsis/*.exe.sig | head -1)
          export SIG_FILE
          echo "signature: $SIG_FILE"
          if ! ASSETS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.assets[].name'); then
            echo "::error::无法读取 Release assets"; exit 1
          fi
          echo "assets:"; echo "$ASSETS"
          EXE_ASSET=$(echo "$ASSETS" | grep -E '\.exe$' | head -1)
          if [ -z "$EXE_ASSET" ]; then echo "::error::Release 中没有 .exe 安装包"; exit 1; fi
          echo "installer: $EXE_ASSET"
          export ASSET_NAME="$EXE_ASSET"
          if ! node -e '
            const fs = require("fs");
            const content = {
              version: process.env.TAG.replace(/^v/, ""),
              notes: process.env.NOTES || ("墨钥 KeyHub " + process.env.TAG),
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(process.env.SIG_FILE, "utf8").trim(),
                  url:
                    "https://github.com/" +
                    process.env.GITHUB_REPOSITORY +
                    "/releases/download/" +
                    process.env.TAG +
                    "/" +
                    encodeURIComponent(process.env.ASSET_NAME)
                }
              }
            };
            fs.writeFileSync("latest.json", JSON.stringify(content, null, 2));
          ' 2> gen.err; then
            echo "::error::生成 latest.json 失败：$(tail -n 5 gen.err | awk '{printf "%s ", $0}')"; exit 1
          fi
          if ! gh release upload "$TAG" latest.json --clobber 2> up.err; then
            echo "::error::上传 latest.json 失败：$(tail -n 5 up.err | awk '{printf "%s ", $0}')"; exit 1
          fi
          echo "latest.json 已上传"
